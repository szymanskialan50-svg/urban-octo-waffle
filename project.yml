name: Lumen
options:
  bundleIdPrefix: com.lumen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pl
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.14.1"
    CURRENT_PROJECT_VERSION: "29"
    YOUTUBE_API_KEY: "AIzaSyCLBVuBjpMfqvQ2xzUlSpxqoGzDuD33g_M"
packages:
  YouTubeKit:
    path: Packages/YouTubeKit
targets:
  Lumen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lumen
    dependencies:
      - package: YouTubeKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Music Player
        CFBundleName: Music Player
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations:
          - pl
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSSpeechRecognitionUsageDescription: "Aplikacja nasłuchuje pobranej piosenki, żeby dopasować do niej tekst (czas i tempo) i wyciszyć przekleństwa. Dźwięk jest przetwarzany na urządzeniu."
        YouTubeAPIKey: "$(YOUTUBE_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.musicplayer
        PRODUCT_NAME: MusicPlayer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Lumen:
    build:
      targets:
        Lumen: all
    run:
      config: Debug
    archive:
      config: Release
